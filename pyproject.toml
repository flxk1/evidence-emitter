[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "evidence-emitter"
version = "0.1.0"
description = "Compose loomground assurance components into one signed, offline-verifiable governance evidence package."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
authors = [{ name = "flxk1" }]
dependencies = []

[project.optional-dependencies]
# The family's canonicalization scheme. Absent it, a stdlib JCS approximation is used.
canonical = ["rfc8785>=0.1"]
# Production Ed25519 signing/verification (key material supplied by the host).
ed25519 = ["cryptography>=41"]
# Any subset of the assurance components may be installed; each is probed at runtime.
assurance = [
    "governance-certification @ git+https://github.com/flxk1/governance-certification@v0.2.0",
    "oversight-certificate @ git+https://github.com/flxk1/oversight-certificate@v0.2.0",
    "enforcement-posture @ git+https://github.com/flxk1/enforcement-posture@v0.5.1",
    "effect-reconciliation @ git+https://github.com/flxk1/effect-reconciliation@v0.2.0",
    "norm-freshness @ git+https://github.com/flxk1/norm-freshness@v0.3.0",
    "obligation-discharge @ git+https://github.com/flxk1/obligation-discharge@v0.1.0",
    "5d-nd @ git+https://github.com/flxk1/5d-nd@v0.2.0",
]
# enforcement-posture and effect-reconciliation are the two assurance
# components the test fixtures exercise for real (see tests/fixtures.py);
# neither is on PyPI, so dev references their source directly, at the same
# release tags the assurance extra names. This suite passes against them.
dev = [
    "pytest>=7",
    "rfc8785>=0.1",
    "cryptography>=41",
    "enforcement-posture @ git+https://github.com/flxk1/enforcement-posture@v0.5.1",
    "effect-reconciliation @ git+https://github.com/flxk1/effect-reconciliation@v0.2.0",
]

[project.scripts]
evidence-emit = "evidence_emitter.cli:emit_main"
evidence-verify = "evidence_emitter.cli:verify_main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
