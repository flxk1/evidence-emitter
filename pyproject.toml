[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "evidence-emitter"
version = "0.1.0"
description = "Compose loomground assurance components into one signed, offline-verifiable governance evidence package."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
authors = [{ name = "flxk1" }]
dependencies = []

[project.optional-dependencies]
# The family's canonicalization scheme. Absent it, a stdlib JCS approximation is used.
canonical = ["rfc8785>=0.1"]
# Production Ed25519 signing/verification (key material supplied by the host).
ed25519 = ["cryptography>=41"]
# Any subset of the assurance components may be installed; each is probed at runtime.
assurance = [
    "governance-certification",
    "oversight-certificate",
    "enforcement-posture",
    "effect-reconciliation",
    "norm-freshness",
    "obligation-discharge",
    "5d-nd",
]
# enforcement-posture and effect-reconciliation are the two assurance
# components the test fixtures exercise for real (see tests/fixtures.py);
# neither is on PyPI, so dev pins them straight to their source, matching
# the commits this suite is known to pass against.
dev = [
    "pytest>=7",
    "rfc8785>=0.1",
    "cryptography>=41",
    "enforcement-posture @ git+https://github.com/flxk1/enforcement-posture@fdd143a2a853fdba980dc45fbd6e69199ad5598c",
    "effect-reconciliation @ git+https://github.com/flxk1/effect-reconciliation@b2b3f995c0d9f9cca9bbabdf628d88cda26c91d2",
]

[project.scripts]
evidence-emit = "evidence_emitter.cli:emit_main"
evidence-verify = "evidence_emitter.cli:verify_main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
